# Linky Live Worker configuration.
#
#   cp wrangler.example.toml wrangler.toml
#
# Then replace the YOUR_… values below, numbered in the order you fill them. The
# last one, the KV namespace id, is filled in for you by `npm run kv`.
# Check your work with `npm run check`. Full walkthrough in SETUP.md.


# ── Fixed. Change only if you want a different Worker name. ──────────────────
name = "linky-live"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true


# ── 1 ── Your Cloudflare account id: `npx wrangler whoami`
account_id = "YOUR_ACCOUNT_ID"


[vars]

# ── 2 ── The domain your links live on, e.g. example.com
ZONE_NAME = "YOUR_ZONE"

# ── 3 ── That zone's id, from its Cloudflare overview page
CF_ZONE_ID = "YOUR_ZONE_ID"

# Not set here on purpose. The Worker cannot see `account_id` above, and TOML has
# no way to reference it, so `npm run deploy` reads it from there and passes it in.
# Set it only if you deploy with plain `wrangler deploy` and want to skip that.
# CF_ACCOUNT_ID = ""

# Fixed. Must match `name` above; the Worker cannot see that either.
WORKER_SCRIPT_NAME = "linky-live"

# Fixed. Gives hostnames like linky-k4d8vn.example.com
HOSTNAME_PREFIX = "linky"

# Fixed. The add-on talks to <this>.<ZONE_NAME>, so linky-live.example.com.
# `npm run deploy` attaches it as a custom domain, which is why the zone is not
# written out a second time here.
API_SUBDOMAIN = "linky-live"


[[kv_namespaces]]
binding = "LINKY"

# ── 4 ── Filled in for you: run `npm run kv`, after step 1. It creates the
# namespace and writes the id here, so there is nothing to copy across.
id = "YOUR_KV_NAMESPACE_ID"


# CF_API_TOKEN is a secret and never goes in this file:
#   npx wrangler secret put CF_API_TOKEN

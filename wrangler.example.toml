# Linky Live Worker configuration.
#
#   cp wrangler.example.toml wrangler.toml
#
# Then replace the YOUR_… values below, numbered in the order you fill them. The
# last one, the KV namespace id, is filled in for you by `npm run kv`.
# Check your work with `npm run check`. Full walkthrough in SETUP.md.


# ── Fixed. Change only if you want a different Worker name. ──────────────────
name = "linky-live"
main = "src/index.js"
compatibility_date = "2026-08-01"

# The workers.dev URL is kept as a way to reach the API if the custom domain is
# ever misconfigured. Preview URLs are off: every deploy would otherwise mint
# another versioned hostname, and anything that is not a provisioned linky-*
# host is served by the control plane — more front doors to the API for no gain.
workers_dev = true
preview_urls = false


# ── 1 ── Your Cloudflare account id: `npx wrangler whoami`
account_id = "YOUR_ACCOUNT_ID"


[vars]

# ── 2 ── The domain your links live on, e.g. example.com
ZONE_NAME = "YOUR_ZONE"

# ── 3 ── That zone's id, from its Cloudflare overview page
CF_ZONE_ID = "YOUR_ZONE_ID"

# Not set here on purpose. The Worker cannot see `account_id` above, and TOML has
# no way to reference it, so `npm run deploy` reads it from there and passes it in.
# Set it only if you deploy with plain `wrangler deploy` and want to skip that.
# CF_ACCOUNT_ID = ""

# Fixed. Must match `name` above; the Worker cannot see that either.
WORKER_SCRIPT_NAME = "linky-live"

# Fixed. Gives hostnames like linky-k4d8vn.example.com
HOSTNAME_PREFIX = "linky"

# Fixed. The add-on talks to <this>.<ZONE_NAME>, so linky-live.example.com.
# `npm run deploy` attaches it as a custom domain, which is why the zone is not
# written out a second time here.
API_SUBDOMAIN = "linky-live"


# ── The admin area, at https://<API_SUBDOMAIN>.<ZONE_NAME>/admin ─────────────
#
# A web UI for the same things `npm run keys` does, plus the accounts that may
# use it. Two roles: an owner manages accounts, a manager manages users and
# their keys. Neither has anything to do with a team key — a key holder runs the
# add-on and never signs in here.

# How people sign in. Leave as "password" unless you want the second option.
#
#   password   email and password, hashed in the Worker. Nothing to set up.
#   access     Cloudflare Zero Trust in front of /admin — Google, Okta, or any
#              other identity provider. No passwords are stored at all. See the
#              "Admin area" section of SETUP.md; the three ACCESS_ settings
#              below are required, and the Worker refuses to serve /admin until
#              they are filled in.
AUTH_MODE = "password"

# ── 4 ── Who the first owner is. `npm run admins init` reads this, creates the
# account, and prints a one-time password. Everything after that happens in the
# web UI or via `npm run admins`.
BOOTSTRAP_OWNER_EMAIL = "YOUR_EMAIL"

# Restrict admin accounts to one email domain, e.g. example.com. Optional with
# passwords, since an account has to be created deliberately anyway. REQUIRED
# with AUTH_MODE = "access", where it is the difference between "our company"
# and "anybody with a Google account".
# ADMIN_EMAIL_DOMAIN = ""

# Only for AUTH_MODE = "access". Your Zero Trust team domain, without https://
# — e.g. yourteam.cloudflareaccess.com
# ACCESS_TEAM_DOMAIN = ""

# Only for AUTH_MODE = "access". The Access application's Audience (AUD) tag,
# from its overview page. This is what stops a token minted for one of your
# other Access apps being replayed here, so it is not optional.
# ACCESS_AUD = ""


[[kv_namespaces]]
binding = "LINKY"

# ── 5 ── Filled in for you: run `npm run kv`, after step 1. It creates the
# namespace and writes the id here, so there is nothing to copy across.
id = "YOUR_KV_NAMESPACE_ID"


# CF_API_TOKEN is a secret and never goes in this file:
#   npx wrangler secret put CF_API_TOKEN

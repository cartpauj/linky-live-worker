# Linky Live Worker configuration.
#
#   cp wrangler.example.toml wrangler.toml
#
# Then replace the six YOUR_… values below, numbered in the order you fill them.
# Check your work with `npm run check`. Full walkthrough in SETUP.md.


# ── Fixed. Change only if you want a different Worker name. ──────────────────
name = "linky-live"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true


# ── 1 ── Your Cloudflare account id: `npx wrangler whoami`
account_id = "YOUR_ACCOUNT_ID"


[vars]

# ── 2 ── The same account id again. The Worker cannot see the one above.
CF_ACCOUNT_ID = "YOUR_ACCOUNT_ID"

# ── 3 ── The domain your links live on, e.g. example.com
ZONE_NAME = "YOUR_ZONE"

# ── 4 ── That zone's id, from its Cloudflare overview page
CF_ZONE_ID = "YOUR_ZONE_ID"

# Fixed. Must match `name` above; the Worker cannot see that either.
WORKER_SCRIPT_NAME = "linky-live"

# Fixed. Gives hostnames like linky-k4d8vn.example.com
HOSTNAME_PREFIX = "linky"


[[kv_namespaces]]
binding = "LINKY"

# ── 5 ── From `npx wrangler kv namespace create LINKY`, after step 1
id = "YOUR_KV_NAMESPACE_ID"


[[routes]]

# ── 6 ── The hostname the add-on talks to, e.g. linky-live.example.com
pattern = "linky-live.YOUR_ZONE"

# Fixed. Lets Cloudflare create the DNS record and certificate for it.
custom_domain = true


# CF_API_TOKEN is a secret and never goes in this file:
#   npx wrangler secret put CF_API_TOKEN

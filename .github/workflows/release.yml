name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The Worker reports its version from package.json on /v1/status, so a tag
      # that disagrees would have operators reading a version that was never
      # deployed under that name.
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"

          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match package.json version $pkg."
            echo "Bump the version in package.json, commit, then retag."
            exit 1
          fi

          echo "Releasing version $pkg"

      - name: Run tests
        run: node --test test/

      # There is no artifact to attach: the Worker is deployed from source with
      # `wrangler deploy`, so a release exists to carry a changelog and to mark the
      # wire contract the add-on can rely on.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
